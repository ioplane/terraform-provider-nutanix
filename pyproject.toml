[project]
name = "terraform-provider-nutanix-dev"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "podman==5.8.0",
    "podman-compose==1.6.0",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
    "ty==0.0.66",
]

[tool.uv]
package = false
required-version = "==0.12.1"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.13"
python = "/opt/venv"

[tool.ty.analysis]
strict-equality-semantics = true

[tool.ty.src]
include = ["scripts", "tests"]
