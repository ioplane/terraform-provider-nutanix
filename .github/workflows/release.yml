name: Release

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch Foundation gate for release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          release_branch="$(jq -er '.headBranchName' <<<"${RELEASE_PR}")"
          gh workflow run ci.yml --ref "${release_branch}" --repo "${GITHUB_REPOSITORY}"

      - name: Check out release tag
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag_name }}

      # tool-version: UV_VERSION=0.12.1
      - name: Install pinned uv launcher
        if: steps.release.outputs.release_created == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Verify host Podman
        if: steps.release.outputs.release_created == 'true'
        run: podman version

      - name: Start private Podman API service
        if: steps.release.outputs.release_created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          socket_dir="${RUNNER_TEMP}/podman-api"
          socket="${socket_dir}/podman.sock"
          service_log="${RUNNER_TEMP}/podman-service.log"
          mkdir -m 0700 "${socket_dir}"
          podman system service --time=0 "unix://${socket}" >"${service_log}" 2>&1 &
          service_pid=$!
          echo "PODMAN_SERVICE_PID=${service_pid}" >> "${GITHUB_ENV}"
          echo "CONTAINER_HOST=unix://${socket}" >> "${GITHUB_ENV}"
          for _ in {1..100}; do
            if test -S "${socket}"; then
              exit 0
            fi
            if ! kill -0 "${service_pid}" 2>/dev/null; then
              cat "${service_log}"
              exit 1
            fi
            sleep 0.1
          done
          cat "${service_log}"
          exit 1

      - name: Build release toolbox
        if: steps.release.outputs.release_created == 'true'
        run: ./dev up

      - name: Build release artifacts in Podman
        if: steps.release.outputs.release_created == 'true'
        run: ./dev task release:build

      - name: Upload release artifacts
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(
            find .cache/goreleaser -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*_SHA256SUMS' -o -name '*.sbom.json' \) \
              -print0 | sort -z
          )
          test "${#artifacts[@]}" -eq 5
          gh release upload "${TAG_NAME}" "${artifacts[@]}"

      - name: Report container status on failure
        if: failure() && steps.release.outputs.release_created == 'true'
        continue-on-error: true
        run: ./dev status
